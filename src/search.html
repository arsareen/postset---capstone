<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070a">
<title>Search | PostSet</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=2026-11-11c">
</head>
<body class="app-body">
<div class="phone app">
<main class="screen" id="main">
  <div class="search-head">
    <span class="mono">Shows and songs</span>
    <h1 class="h-lg" style="margin-top:6px">Search</h1>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input id="q" type="search" placeholder="Artist, venue or song" autocomplete="off" enterkeyhint="search" aria-label="Search shows and songs">
      <button class="clear" id="clear" type="button" hidden>Clear</button>
    </label>
  </div>
  <div id="results" aria-live="polite"><p class="loading mono">Loading…</p></div>
</main>
<div id="tabbar-slot" data-here="search"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js?v=2026-11-11c"></script>
<script src="supabase-client.js?v=2026-11-11c"></script>
<script src="song-key.js?v=2026-11-11c"></script>
<script src="clips-store.js?v=2026-11-11c"></script>
<script src="app.js?v=2026-11-11c"></script>
<script src="search.js?v=2026-11-11c"></script>
</body>
</html>
