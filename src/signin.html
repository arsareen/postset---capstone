<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070a">
<title>Sign in | PostSet</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=2026-11-11c">
</head>
<body class="app-body">
<div class="phone app">
<main class="screen">
  <div class="profile-head">
    <div>
      <span class="mono">PostSet · Every moment, every angle</span>
      <h1 class="h-lg" style="margin-top:6px" id="signin-title">Sign in</h1>
    </div>
  </div>
  <p class="status-line" id="signin-status" aria-live="polite" hidden></p>
  <form class="form" id="signin-form" novalidate style="padding-top:22px">
    <div class="form-field" data-field="email">
      <label for="signin-email"><span class="mono">Email</span></label>
      <input id="signin-email" type="email" autocomplete="email" required>
      <span class="err" hidden></span>
    </div>
    <div class="form-field" data-field="password">
      <label for="signin-password"><span class="mono">Password</span></label>
      <input id="signin-password" type="password" autocomplete="current-password" minlength="6" required>
      <span class="hint" id="signin-password-hint" hidden>At least 6 characters.</span>
      <span class="err" hidden></span>
    </div>
    <p class="form-error" id="signin-error" hidden></p>
    <div class="foot" style="padding-left:0;padding-right:0">
      <button class="btn" type="submit" id="signin-submit">Sign in</button>
    </div>
    <p style="text-align:center;margin-top:18px">
      <span id="signin-switch-text">New here?</span>
      <button type="button" class="link-btn" id="signin-switch">Create an account</button>
    </p>
  </form>
</main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js?v=2026-11-11c"></script>
<script src="supabase-client.js?v=2026-11-11c"></script>
<script src="signin.js?v=2026-11-11c"></script>
</body>
</html>
